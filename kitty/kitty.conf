# BEGIN_KITTY_THEME
include ./themes/evergarden-winter-green.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
# END_KITTY_FONTS

# background_image /home/raianeeo/Pictures/Wallpapers/planta-tv.jpg
# background_image_layout cscaled
# background_tint 0.98

# Smear cursor
cursor_trail 3

# O primeiro valor (0.1) é o tempo em segundos que o rastro leva para começar a sumir
# O segundo valor (0.4) controla a velocidade da animação de desaparecimento
cursor_trail_decay 0.1 0.4

# Faz com que o rastro apareça mesmo em movimentos curtos (em pixels)
cursor_trail_start_threshold 0

# Define o tamanho inicial em células (colunas x linhas)
remember_window_size  no
initial_window_width  140c
initial_window_height 35c

confirm_os_window_close 0

map super+q quit

# Config from neovim plugin knubie/vim-kitty-navigator
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_VIM=true ctrl+h
map --when-focus-on var:IS_VIM=true ctrl+j
map --when-focus-on var:IS_VIM=true ctrl+k
map --when-focus-on var:IS_VIM=true ctrl+l

allow_remote_control yes
listen_on unix:@mykitty

enabled_layouts splits


# Horizontal split (uma janela abaixo da outra)
map ctrl+shift+minus launch --location=hsplit

# Vertical split (uma janela ao lado da outra)
map ctrl+shift+backslash launch --location=vsplit
