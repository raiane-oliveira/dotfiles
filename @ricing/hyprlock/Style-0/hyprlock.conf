general {
  hide_cursor = false
  grace = 0
}

background {
  monitor = 
  path = ~/Pictures/Wallpapers/evening-sky.png
  blur_passes = 2
  blur_size = 1
}

#####################
# RELÓGIO
#####################

label {
  monitor =
  text = cmd[update:1000] date +"%H:%M"
  font_famity = SF Pro Text Bold
  font_size = 112
  color = rgba(251, 241, 199, 1.0)
  position = -160, 50
  halign = right
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date +"%d/%m/%Y"
  font_famity = SF Pro Text Bold
  font_size = 22
  color = rgba(251, 241, 199, 1.0)
  position = -268, -50
  halign = right
  valign = center
}

#####################
# PASSWORD
#####################
input-field {
  monitor =
  size = 225, 36
  position = -230, -140
  halign = right
  valign = center
  outline_thickness = 2

  rounding = 5
  outer_color = rgba(251, 241, 199, 1.0)
  inner_color = rgba(0, 0, 0, 0.0)
  font_color = rgba(251, 241, 199, 1.0)

  font_famity = SF Pro Text
  placeholder_text = Digite sua senha
  dots_size = 0.25
  dots_spacing = 0.4
  fade_on_empty = true
}

# Botão de Desligar
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.6)
    font_size = 30
    font_family = Font Awesome 6 Free 
    position = -50, 50
    halign = right
    valign = bottom
    on-click = hyprshutdown systemctl poweroff
    # on-click = wlogout
}

