###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

$terminal = kitty
$fileManager = nautilus
$menu = ~/.config/rofi/launchers/current || pkill rofi
# $clipboard = ~/.config/rofi/launchers/type-6/clipboard.sh || pkill rofi
# $clipboard = kitty --class clipse -e 'clipse'
$clipboard = clipse-gui
$powermenu = ~/.config/rofi/powermenu/current || pkill rofi
$browser = brave
# $screenshot = quickshell -c HyprQuickFrame -n
$screenshot = hyprshot -m region --freeze --raw | swappy -f -
$playerctl = ~/.config/rofi/applets/bin/playerctl.sh || pkill rofi
$pkgmanager = ~/.config/rofi/applets/bin/pkgmanager.sh menu || pkill rofi
$miselang = ~/.config/rofi/applets/bin/mise-lang.sh menu || pkill rofi
$editconfigs = ~/.config/rofi/applets/bin/dotfiles-edit-menu.sh || pkill rofi
$setwallpaper = ~/.config/rofi/applets/bin/wallpapers.sh || pkill rofi
$raianeflix = ~/.config/rofi/applets/bin/raianeflix.sh || pkill rofi
$changewaybar = ~/.config/rofi/applets/bin/change-waybar.sh || pkill rofi

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER 

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod ALT, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, F, fullscreen
bind = $mainMod, R, exec, ~/.config/waybar/scripts/launch.sh
bind = $mainMod, B, exec, $browser
bind = $mainMod, M, exec, flatpak run com.spotify.Client
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod, 0, exec, hyprpicker --autocopy -n
bind = $mainMod, N, exec, brave --app=https://www.notion.so
bind = $mainMod, A, exec, brave --app=https://www.claude.ai
bind = $mainMod, G, togglegroup
bind = $mainMod CTRL, Space, exec, handy --toggle-transcription --start-hidden
bind = $mainMod CTRL SHIFT, Space, exec, pkill -9 handy

# Opens HyprQuickFrame - Decided on-the-fly whether to Edit, Save, or Copy
bind = $mainMod SHIFT, S, exec, $screenshot
bind = , PRINT, exec, $screenshot

bind = $mainMod, D, exec, ~/scripts/toggle_wayscriber.sh
bind = $mainMod SHIFT, D, exec, pkill -9 wayscriber

# Rofi
bind = $mainMod, Space, exec, $menu
bind = $mainMod, P, exec, $powermenu
bind = $mainMod, H, exec, $clipboard
bind = $mainMod SHIFT, M, exec, $playerctl
bind = $mainMod, I, exec, $pkgmanager
bind = $mainMod, C, exec, $miselang
bind = $mainMod, O, exec, [float] $editconfigs
bind = $mainMod, W, exec, $setwallpaper
bind = $mainMod, K, exec, [float] $raianeflix
bind = $mainMod SHIFT, B, exec, $changewaybar

# Move focus with mainMod + hjkl (vim style)
bind = $mainMod CTRL, l, movefocus, r
bind = $mainMod CTRL, h, movefocus, l
bind = $mainMod CTRL, k, movefocus, u
bind = $mainMod CTRL, j, movefocus, d

# Atalhos para trocar a posição das janelas (swap)
bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, l, swapwindow, r
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, j, swapwindow, d

# Resize active window
bind = $mainMod CTRL SHIFT, l, resizeactive, 25 0
bind = $mainMod CTRL SHIFT, h, resizeactive, -25 0
bind = $mainMod CTRL SHIFT, k, resizeactive, 0 -25
bind = $mainMod CTRL SHIFT, j, resizeactive, 0 25

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, TAB, changegroupactive, f
bind = $mainMod SHIFT, TAB, changegroupactive, b

bind = ALT SHIFT, l, movegroupwindow, f
bind = ALT SHIFT, h, movegroupwindow, b
bind = ALT SHIFT, k, moveoutofgroup, u

# Overview
# bind = $mainMod SHIFT, O, hyprexpo:expo, toggle

# Overwatch (control center)
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
# bind = $mainMod, 0, workspace, 10
bind = $mainMod CTRL, left, workspace, -1
bind = $mainMod CTRL, right, workspace, +1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
# bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod CTRL SHIFT, left, movetoworkspace, -1
bind = $mainMod CTRL SHIFT, right, movetoworkspace, +1

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Media Player - Usando bindl para funcionar na tela de bloqueio (sem repetição)
bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl = , XF86AudioPause, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl previous

